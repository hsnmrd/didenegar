name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Typecheck
        run: pnpm exec tsc --noEmit
        
      - name: Lint
        run: pnpm run lint
        
      - name: Build
        run: pnpm run build
